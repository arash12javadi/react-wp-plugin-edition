<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Placeholder only: replaced by server/seo.mjs, then by the app (placeholderTitle in src/lib/settings.ts). -->
    <title>React-WP</title>
    <!--rwp-seo-->
    <script>window.__REACT_WP_CONFIG__=null;</script>
    <!--
      Warm the backend's origin while the bundle is still being downloaded and parsed. The boot
      sequence asks that origin for a row before the first render, so paying DNS + TLS for a cold
      connection would put a round trip in front of a round trip. Supabase is the only backend the
      browser talks to directly; the others are read through this site's own /api/db/query.
    -->
    <script>
      (function () {
        var config = window.__REACT_WP_CONFIG__;
        var url = config && config.dbType === 'supabase' && config.supabaseUrl;
        if (!url) return;
        try {
          var origin = new URL(url).origin;
          ['preconnect', 'dns-prefetch'].forEach(function (rel) {
            var link = document.createElement('link');
            link.rel = rel;
            link.href = origin;
            if (rel === 'preconnect') link.crossOrigin = 'anonymous';
            document.head.appendChild(link);
          });
        } catch (error) {
          // A malformed URL is the configuration's problem, and the boot screen reports it.
        }
      })();
    </script>
    <!--
      The boot screen (`#rwp-boot` below), painted by the browser before any JavaScript runs, so the
      page is never blank while the bundle downloads.

      The picture is the React-WP logo, animated: a navy hexagon with the three orbits of an atom
      (React) around a ringed "W" (the CMS). The orbits turn slowly with an electron travelling each
      one, a ripple pulses out of the centre and a sheen crosses the hexagon, over the name, a status
      line and a progress bar. It is an overlay outside #root, so
      React rendering into #root does not replace it: it stays up, with the same animation running,
      through the whole boot. `src/lib/bootSplash.ts` writes each boot stage into its status line and
      bar, and fades it out once the first real screen has rendered.

      These styles are also the stylesheet of `src/components/BootSplash.tsx`, which draws the same
      screen (without the overlay's id) for a wait that comes after this one is gone — the classes
      are global because this <style> is in every page the app serves. Change the markup in step.

      Only `transform` and `opacity` are animated, so every motion here runs on the compositor and
      keeps going while the main thread is busy parsing and running the bundle.
    -->
    <style>
      .rwp-boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 24px;
        box-sizing: border-box;
        color: #475569;
        background-color: #f7f8fc;
        background-image: radial-gradient(circle at 50% 40%, rgb(49 71 106 / 12%), transparent 48%);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        text-align: center;
        transition: opacity 0.32s ease, visibility 0s linear 0.32s;
      }
      #rwp-boot {
        z-index: 2147483000;
      }
      .rwp-boot[data-state="done"] {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      /* The logo is drawn in a 132 × 132 box whose SVG viewBoxes match it 1:1, so the electrons'
         pixel offsets below are the orbit radii in the SVG (rx 49, ry 19). Layers, bottom to top:
         glow, hexagon, sheen, ripple, orbits (+ electrons), the ringed "W". */
      .rwp-boot-logo {
        position: relative;
        width: 132px;
        height: 132px;
        margin-bottom: 4px;
        animation: rwp-boot-float 3.6s ease-in-out infinite;
      }
      .rwp-boot-logo > span {
        position: absolute;
        inset: 0;
      }
      .rwp-boot-logo svg {
        display: block;
        width: 100%;
        height: 100%;
        overflow: visible;
      }
      .rwp-boot-glow {
        border-radius: 50%;
        background: radial-gradient(circle, rgb(49 71 106 / 42%), transparent 66%);
        animation: rwp-boot-glow 3.6s ease-in-out infinite;
      }
      .rwp-boot-hex {
        filter: drop-shadow(0 12px 18px rgb(30 43 67 / 28%));
        animation: rwp-boot-pop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) both;
      }
      /* Clipped to the hexagon's outline (its points, padded for the rounded corners). */
      .rwp-boot-sheen {
        overflow: hidden;
        clip-path: polygon(50% 3%, 90.7% 26.5%, 90.7% 73.5%, 50% 97%, 9.3% 73.5%, 9.3% 26.5%);
      }
      .rwp-boot-sheen::after {
        content: "";
        position: absolute;
        inset: -20% 0;
        background: linear-gradient(105deg, transparent 38%, rgb(255 255 255 / 16%) 50%, transparent 62%);
        transform: translateX(-100%);
        animation: rwp-boot-sheen 3.6s ease-in-out 0.8s infinite;
      }
      .rwp-boot-logo > .rwp-boot-ripple {
        inset: 44px;
        border: 2px solid rgb(255 255 255 / 70%);
        border-radius: 50%;
        opacity: 0;
        animation: rwp-boot-ripple 2.4s cubic-bezier(0.2, 0.6, 0.3, 1) 0.6s infinite;
      }
      .rwp-boot-atom {
        animation: rwp-boot-atom-in 0.9s cubic-bezier(0.2, 0.8, 0.2, 1) 0.1s both;
      }
      .rwp-boot-spin {
        position: absolute;
        inset: 0;
        animation: rwp-boot-spin 16s linear infinite;
        will-change: transform;
      }
      /* An electron runs its orbit as two eased swings: across (translateX, ±rx) and up and down
         (translateY, ±ry) a quarter-turn behind, which together trace the ellipse. Each rig is turned
         to its orbit's angle. --d is half a lap. */
      .rwp-boot-e {
        position: absolute;
        inset: 0;
        transform: rotate(var(--a));
      }
      .rwp-boot-ex {
        position: absolute;
        left: 50%;
        top: 50%;
        animation: rwp-boot-ex var(--d) cubic-bezier(0.37, 0, 0.63, 1) var(--o) infinite alternate;
      }
      .rwp-boot-ey {
        position: absolute;
        width: 8px;
        height: 8px;
        margin: -4px 0 0 -4px;
        border-radius: 50%;
        background: #e0f2fe;
        box-shadow: 0 0 0 2px rgb(49 71 106 / 70%), 0 0 10px 3px rgb(125 211 252 / 85%);
        animation: rwp-boot-ey var(--d) cubic-bezier(0.37, 0, 0.63, 1) calc(var(--o) - var(--d) / 2) infinite alternate;
      }
      .rwp-boot-e1 { --a: 0deg; --d: 1.3s; --o: 0s; }
      .rwp-boot-e2 { --a: 60deg; --d: 1.6s; --o: -0.9s; }
      .rwp-boot-e3 { --a: 120deg; --d: 1.45s; --o: -1.7s; }
      .rwp-boot-core {
        animation: rwp-boot-pop 0.55s cubic-bezier(0.34, 1.56, 0.64, 1) 0.35s both;
      }
      .rwp-boot-name {
        margin: 0;
        color: #1e2b43;
        font-size: 1.4rem;
        font-weight: 800;
        line-height: 1.1;
        letter-spacing: -0.02em;
      }
      .rwp-boot-name span {
        color: #31476a;
        background: linear-gradient(90deg, #31476a, #5f86c0);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .rwp-boot-label {
        min-height: 1.4em;
        margin: 0;
        font-size: 0.92rem;
        font-weight: 500;
        line-height: 1.4;
      }
      .rwp-boot-track {
        width: 184px;
        max-width: 60vw;
        height: 4px;
        overflow: hidden;
        border-radius: 999px;
        background: rgb(49 71 106 / 12%);
      }
      .rwp-boot-fill {
        position: relative;
        display: block;
        width: 100%;
        height: 100%;
        overflow: hidden;
        border-radius: inherit;
        background: linear-gradient(90deg, #31476a, #5f86c0);
        transform: scaleX(var(--rwp-boot-progress, 0.08));
        transform-origin: left center;
        transition: transform var(--rwp-boot-speed, 2.6s) cubic-bezier(0.2, 0.7, 0.2, 1);
      }
      .rwp-boot-fill::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(90deg, transparent, rgb(255 255 255 / 55%), transparent);
        transform: translateX(-100%);
        animation: rwp-boot-shine 1.5s ease-in-out infinite;
      }
      .rwp-boot-detail {
        max-width: 36ch;
        margin: 0;
        color: #94a3b8;
        font-size: 0.82rem;
      }
      @keyframes rwp-boot-spin {
        to { transform: rotate(360deg); }
      }
      @keyframes rwp-boot-float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-4px); }
      }
      @keyframes rwp-boot-glow {
        0%, 100% { opacity: 0.55; transform: scale(0.92); }
        50% { opacity: 1; transform: scale(1.12); }
      }
      @keyframes rwp-boot-pop {
        from { opacity: 0; transform: scale(0.6); }
        to { opacity: 1; transform: none; }
      }
      @keyframes rwp-boot-atom-in {
        from { opacity: 0; transform: scale(0.35) rotate(-120deg); }
        to { opacity: 1; transform: none; }
      }
      @keyframes rwp-boot-sheen {
        0% { transform: translateX(-100%); }
        45%, 100% { transform: translateX(100%); }
      }
      @keyframes rwp-boot-ripple {
        0% { opacity: 0.85; transform: scale(1); }
        100% { opacity: 0; transform: scale(2.3); }
      }
      @keyframes rwp-boot-ex {
        from { transform: translateX(-49px); }
        to { transform: translateX(49px); }
      }
      @keyframes rwp-boot-ey {
        from { transform: translateY(-19px); }
        to { transform: translateY(19px); }
      }
      @keyframes rwp-boot-shine {
        to { transform: translateX(100%); }
      }
      /* A boot screen is no place to spend someone's battery or make them queasy: the logo stands
         still, without electrons or ripple, and the bar only moves when a stage completes. */
      @media (prefers-reduced-motion: reduce) {
        .rwp-boot-logo,
        .rwp-boot-logo > span,
        .rwp-boot-spin,
        .rwp-boot-fill::after {
          animation: none;
        }
        .rwp-boot-glow,
        .rwp-boot-sheen,
        .rwp-boot-logo > .rwp-boot-ripple,
        .rwp-boot-e {
          display: none;
        }
        .rwp-boot-fill {
          transition-duration: 0.2s;
        }
      }
    </style>
  </head>
  <body>
    <!-- Kept up through the whole boot by src/lib/bootSplash.ts. Keep in step with src/components/BootSplash.tsx. -->
    <div id="rwp-boot" class="rwp-boot" role="status" aria-live="polite" aria-busy="true">
      <div class="rwp-boot-logo" aria-hidden="true">
        <span class="rwp-boot-glow"></span>
        <span class="rwp-boot-hex">
          <svg viewBox="0 0 132 132" focusable="false"><polygon points="66,8 116.23,37 116.23,95 66,124 15.77,95 15.77,37" fill="#31476a" stroke="#31476a" stroke-width="8" stroke-linejoin="round" /></svg>
        </span>
        <span class="rwp-boot-sheen"></span>
        <span class="rwp-boot-ripple"></span>
        <span class="rwp-boot-atom">
          <span class="rwp-boot-spin">
            <svg viewBox="0 0 132 132" focusable="false"><g fill="none" stroke="#fff" stroke-width="4"><ellipse cx="66" cy="66" rx="49" ry="19" /><ellipse cx="66" cy="66" rx="49" ry="19" transform="rotate(60 66 66)" /><ellipse cx="66" cy="66" rx="49" ry="19" transform="rotate(120 66 66)" /></g></svg>
            <span class="rwp-boot-e rwp-boot-e1"><span class="rwp-boot-ex"><span class="rwp-boot-ey"></span></span></span>
            <span class="rwp-boot-e rwp-boot-e2"><span class="rwp-boot-ex"><span class="rwp-boot-ey"></span></span></span>
            <span class="rwp-boot-e rwp-boot-e3"><span class="rwp-boot-ex"><span class="rwp-boot-ey"></span></span></span>
          </span>
        </span>
        <span class="rwp-boot-core">
          <svg viewBox="0 0 132 132" focusable="false"><circle cx="66" cy="66" r="18.5" fill="#31476a" stroke="#fff" stroke-width="3.5" /><circle cx="66" cy="66" r="13.5" fill="none" stroke="#fff" stroke-width="1.6" /><text x="66" y="66.5" fill="#fff" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-weight="700" text-anchor="middle" dominant-baseline="central">W</text></svg>
        </span>
      </div>
      <p class="rwp-boot-name" aria-hidden="true">React<span>-WP</span></p>
      <p class="rwp-boot-label" data-rwp-boot-label>Loading…</p>
      <div class="rwp-boot-track" aria-hidden="true"><span class="rwp-boot-fill"></span></div>
      <p class="rwp-boot-detail" data-rwp-boot-detail hidden></p>
    </div>
    <script>
      // The first stretch of the bar: a slow creep towards a third while the bundle downloads. Set one
      // frame after the first paint so it runs as a transition — on the compositor, unaffected by the
      // bundle's parse — and the app's own stages carry it on from wherever it has reached.
      requestAnimationFrame(function () {
        requestAnimationFrame(function () {
          var boot = document.getElementById('rwp-boot');
          if (boot && !boot.dataset.state) boot.style.setProperty('--rwp-boot-progress', '0.32');
        });
      });
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
